<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg border-0 rounded-4 mt-5">
        <div class="card-header bg-success text-white border-0 py-4 text-center rounded-top-4">
          <i class="fas fa-lock fa-3x mb-3 text-white"></i>
          <h3 class="fw-bold mb-0 text-white">Reset Password</h3>
          <p class="mb-0 text-white-50">Secure your account</p>
        </div>
        <div class="card-body p-4 p-md-5">
          <form (ngSubmit)="changePassword()">
            <div class="mb-4">
              <label class="form-label fw-bold text-muted small text-uppercase letter-spacing-1">Current Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-key text-secondary"></i></span>
                <input type="password" class="form-control border-start-0 bg-light" [(ngModel)]="currentPassword" name="currentPassword" placeholder="Enter current password" required>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-bold text-muted small text-uppercase letter-spacing-1">New Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-secondary"></i></span>
                <input type="password" class="form-control border-start-0 bg-light" [(ngModel)]="newPassword" name="newPassword" placeholder="Enter new password" required>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-bold text-muted small text-uppercase letter-spacing-1">Confirm New Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-check-circle text-secondary"></i></span>
                <input type="password" class="form-control border-start-0 bg-light" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required>
              </div>
            </div>
            
            <div class="d-grid gap-2 mt-5">
              <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm" [disabled]="!currentPassword || !newPassword || !confirmPassword || isSubmitting">
                <i class="fas fa-spinner fa-spin me-2" *ngIf="isSubmitting"></i> 
                Update Password
              </button>
              <button type="button" class="btn btn-light rounded-pill fw-bold text-muted" (click)="goBack()">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
