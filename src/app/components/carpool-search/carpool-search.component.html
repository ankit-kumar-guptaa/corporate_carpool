<div class="container my-5">
  <section class="card mb-4 shadow-lg border-0 search-carpool-card animate-card">
    <div class="card-body p-5">
      <h2 class="card-title mb-4 text-gradient">Find a Carpool Partner</h2>
      
      <!-- Form Section -->
      <div class="row g-4 mb-4 align-items-end">
        <div class="col-md-2">
          <label for="role" class="form-label fw-bold text-muted">Are you a:</label>
          <select id="role" class="form-select form-input shadow-sm" [(ngModel)]="selectedRole">
            <option value="Either">Either</option>
            <option value="Pooler">Pooler</option>
            <option value="Seeker">Seeker</option>
          </select>
        </div>
        
        <div class="col-md-3" style="
        position: relative;
        top: 25px;
    ">
          <label for="from" class="form-label fw-bold text-muted">From</label>
          <AutocompleteComponent (setAddress)="handleDropAddress($event, 'From')" [autocompleteInput]="postRide.From_Address" ></AutocompleteComponent>
        </div>

        <div class="col-md-2 text-center">
          <button type="button" class="btn add-via-button shadow-sm" (click)="addVia()">
            <span class="d-flex align-items-center">
              <i class="fas fa-plus-circle me-2"></i> Add Via
            </span>
          </button>
        </div>

        <div class="col-md-5">
          <label for="to" class="form-label fw-bold text-muted">To (Office Address)</label>
          <input type="text" id="to" name="to" class="form-control form-input shadow-sm" 
                 value="B2, Plot 2 Tower 1, Nr Indus Valley School, Block B, Industrial Area, Sector 62, Noida, Uttar Pradesh 201309" readonly>
        </div>
      </div>

      <!-- Via Inputs -->
      <div *ngIf="isAddViaClicked" class="via-inputs mt-4 animate-fade-in">
        <div class="row g-3">
          <div class="col-md-4" *ngFor="let location of viaLocations; let i = index">
            <AutocompleteComponent></AutocompleteComponent>
          </div>
        </div>
      </div>

      <!-- Remark and Contact Section -->
<div class="remark-contact-section mt-5">
  <h4 class="mb-3 text-muted">Additional Details</h4>
  <div class="row g-4">
    <!-- Remark Input (Combined with Manual Phone) -->
    <div class="col-12">
      <label for="remark" class="form-label fw-bold text-muted">Remark</label>
      <input type="text" id="remark" class="form-control form-input shadow-sm" 
             [(ngModel)]="userRemark" placeholder="Update remarks with additional instructions if any." 
             (input)="updateRemarkManually($event)">
    </div>
  </div>
</div>

      <!-- Buttons -->
      <div class="text-center mt-5 d-flex justify-content-center gap-3">
        <button type="button" class="btn btn-gradient-primary btn-lg search-button shadow-lg" 
                (click)="searchCarpool()">
          <span *ngIf="!isLoadingSearch" class="d-flex align-items-center">
            <i class="fas fa-search me-2"></i> Search
          </span>
          <span *ngIf="isLoadingSearch" class="d-flex align-items-center">
            <i class="fas fa-spinner fa-spin me-2"></i> Searching...
          </span>
        </button>

        <button type="button" class="btn btn-gradient-success btn-lg submit-button shadow-lg" 
                (click)="submitRequest()" [disabled]="isLoadingSubmit">
          <span *ngIf="!isLoadingSubmit" class="d-flex align-items-center">
            <i class="fas fa-check-circle me-2"></i> Submit
          </span>
          <span *ngIf="isLoadingSubmit" class="d-flex align-items-center">
            <i class="fas fa-spinner fa-spin me-2"></i> Submitting...
          </span>
        </button>
      </div>
    </div>
  </section>

  <!-- Carpool Results -->
  <div *ngIf="RideList.length > 0" class="results mt-5 carpool-results-container">
    <h4 class="mb-4 text-gradient-secondary animate-title">Available Carpools</h4>
    <ul class="list-group carpool-list">
      <li class="list-group-item mb-3 shadow-sm animate-list-item" *ngFor="let carpool of RideList; let i = index" [style.--order]="i">
        <div class="row align-items-center">
          <div class="col-12 col-md-9 mb-2 mb-md-0">
            <div class="carpool-info">
              <span class="user-type badge bg-primary me-2">{{ carpool.userType }}</span>
              <span class="fw-bold">{{ carpool.userName }}</span>
              <span class="badge bg-light text-muted ms-2">{{ carpool.from_Address }}</span>
            </div>
          </div>
          <div class="col-12 col-md-3 text-center text-md-end">
            <button [disabled]="carpool.isSendRequest" 
                    class="btn btn-connect btn-outline-primary shadow-sm" 
                    (click)="connectCarpool(carpool)">
              <i class="fas fa-link me-2"></i> Connect
            </button>
          </div>
        </div>
      </li>
    </ul>
  </div>

  <div *ngIf="RideList.length < 1" class="results mt-5 text-center">
    <h4 class="mb-4 text-muted animate-title">No Record Found</h4>
    <p class="text-muted">Try adjusting your search criteria!</p>
  </div>
</div>
