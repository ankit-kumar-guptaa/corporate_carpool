<div class="container-fluid py-5">
  <div class="row justify-content-center align-items-stretch g-5">
    <!-- Reset Password Form -->
    <div class="col-lg-5 col-md-7 col-sm-10 mb-4">
      <div class="login-signup-card h-100">
        <div class="card-body p-4 p-lg-5">
          <div class="text-center mb-4">
            <h3 class="fw-bold">Reset Your <span class="text-success">Password</span></h3>
            <p class="text-muted">Choose a new password to secure your account</p>
          </div>

          <form #resetForm="ngForm" (ngSubmit)="resetPassword(resetForm)" novalidate class="form-section animate-fade-in">
            <!-- Email (readonly) -->
            <div class="mb-4 input-group-custom">
              <label for="reset-email" class="form-label">Email Address</label>
              <div class="input-with-icon">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email"
                       id="reset-email"
                       name="reset-email"
                       [(ngModel)]="email"
                       class="form-control form-input"
                       placeholder="Your email"
                       readonly>
              </div>
            </div>

            <!-- New Password -->
            <div class="mb-4 input-group-custom">
              <label for="reset-new-password" class="form-label">New Password</label>
              <div class="input-with-icon">
                <i class="fas fa-lock input-icon"></i>
                <input [type]="showNewPassword ? 'text' : 'password'"
                       id="reset-new-password"
                       name="reset-new-password"
                       #newPasswordCtrl="ngModel"
                       [(ngModel)]="newPassword"
                       class="form-control form-input"
                       placeholder="Enter new password"
                       minlength="6"
                       required>
                <button type="button"
                        class="btn btn-link password-toggle"
                        (click)="toggleNewPassword()"
                        tabindex="-1"
                        [attr.aria-label]="showNewPassword ? 'Hide password' : 'Show password'">
                  <i class="fas" [class.fa-eye]="!showNewPassword" [class.fa-eye-slash]="showNewPassword"></i>
                </button>
              </div>
              <div class="validation-message"
                   *ngIf="newPasswordCtrl.touched && newPasswordCtrl.errors?.['required']">
                New password is required.
              </div>
              <div class="validation-message"
                   *ngIf="newPasswordCtrl.touched && newPasswordCtrl.errors?.['minlength']">
                Password must be at least 6 characters.
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4 input-group-custom">
              <label for="reset-confirm-password" class="form-label">Confirm Password</label>
              <div class="input-with-icon">
                <i class="fas fa-check-circle input-icon"></i>
                <input [type]="showConfirmPassword ? 'text' : 'password'"
                       id="reset-confirm-password"
                       name="reset-confirm-password"
                       #confirmPasswordCtrl="ngModel"
                       [(ngModel)]="confirmPassword"
                       class="form-control form-input"
                       placeholder="Re-enter new password"
                       required>
                <button type="button"
                        class="btn btn-link password-toggle"
                        (click)="toggleConfirmPassword()"
                        tabindex="-1"
                        [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
                  <i class="fas" [class.fa-eye]="!showConfirmPassword" [class.fa-eye-slash]="showConfirmPassword"></i>
                </button>
              </div>
              <div class="validation-message"
                   *ngIf="confirmPasswordCtrl.touched && confirmPasswordCtrl.errors?.['required']">
                Please confirm your password.
              </div>
              <div class="validation-message"
                   *ngIf="confirmPasswordCtrl.touched && confirmPassword && !passwordsMatch()">
                Passwords do not match.
              </div>
            </div>

            <button type="submit"
                    class="btn btn-primary btn-lg w-100 shadow-sm mb-3"
                    [disabled]="!isFormValid(resetForm) || isSubmitting">
              <i *ngIf="!isSubmitting" class="fas fa-key me-2"></i>
              <i *ngIf="isSubmitting" class="fas fa-spinner fa-spin me-2"></i>
              {{ isSubmitting ? 'Updating...' : 'Reset Password' }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
