<div class="d-flex" id="wrapper">
  <!-- Sidebar -->
  <div class="glass-sidebar" id="sidebar-wrapper">
    <!-- Logo -->
    <div class="sidebar-brand">
      <a class="d-flex align-items-center text-decoration-none" href="#">
        <img src="https://www.airliquide.com/sites/airliquide.com/files/air-liquide_0.svg" alt="Air Liquide"
          height="40" class="sidebar-logo">
      </a>
    </div>

    <!-- Navigation -->
    <div class="sidebar-nav px-3">
      <p class="sidebar-section-title">MAIN MENU</p>
      <a routerLink="/admin/dashboard" routerLinkActive="active" class="sidebar-link">
        <div class="sidebar-link-icon"><i class="fas fa-th-large"></i></div>
        <span>Dashboard</span>
      </a>
      <a routerLink="/admin/employees" routerLinkActive="active" class="sidebar-link">
        <div class="sidebar-link-icon"><i class="fas fa-users"></i></div>
        <span>Employees</span>
      </a>
      <a routerLink="/admin/rides" routerLinkActive="active" class="sidebar-link">
        <div class="sidebar-link-icon"><i class="fas fa-car"></i></div>
        <span>Rides</span>
      </a>
      <a routerLink="/admin/reports" routerLinkActive="active" class="sidebar-link">
        <div class="sidebar-link-icon"><i class="fas fa-chart-pie"></i></div>
        <span>Analytics</span>
      </a>
    </div>

    <!-- User Card & Logout -->
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="d-flex align-items-center">
          <div class="user-avatar">
            <img src="assets/admin-avatar.png"
              onerror="this.src='https://ui-avatars.com/api/?name=Admin&background=667eea&color=fff&bold=true'"
              class="rounded-circle" width="38" height="38">
          </div>
          <div class="overflow-hidden ms-3">
            <div class="fw-bold text-white text-truncate" style="font-size: 0.85rem;">{{adminName | titlecase}}</div>
            <div class="text-white-50 text-truncate" style="font-size: 0.72rem;">{{adminName}}&#64;greencar.com</div>
          </div>
        </div>
      </div>
      <a href="javascript:void(0)" (click)="logout()" class="logout-btn">
        <i class="fas fa-sign-out-alt me-2"></i> Logout
      </a>
    </div>
  </div>

  <!-- Page Content -->
  <div id="page-content-wrapper" class="w-100 bg-light-modern">
    <nav class="top-navbar sticky-top">
      <div class="container-fluid d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
          <button class="menu-toggle-btn" id="menu-toggle" (click)="toggleSidebar()">
            <i class="fas fa-bars"></i>
          </button>
          <div class="d-none d-md-block">
            <span class="text-muted small fw-medium">Welcome back,</span>
            <span class="text-dark fw-bold ms-1">{{adminName | titlecase}} 👋</span>
          </div>
        </div>

        <div class="d-flex align-items-center gap-3">
          <div class="notification-btn position-relative">
            <i class="far fa-bell"></i>
            <span class="notification-dot"></span>
          </div>
        </div>
      </div>
    </nav>

    <div class="content-container px-4 pb-5">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
