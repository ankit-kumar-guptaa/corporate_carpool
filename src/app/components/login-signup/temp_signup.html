          <!-- Signup Form -->
          <div *ngIf="!isLoginActive" class="form-section signup-container animate-fade-in">
            <!-- Modern Stepper -->
            <div class="signup-stepper mb-4">
              <div class="progress-track">
                <div class="progress-fill" [style.width]="currentStep === 1 ? '33%' : (currentStep === 2 ? '66%' : '100%')"></div>
              </div>
              
              <!-- Step 1: Verification -->
              <div class="step-item" [class.active]="currentStep === 1" [class.completed]="currentStep > 1">
                <div class="step-circle">
                  <i class="fas" [class.fa-shield-alt]="currentStep === 1" [class.fa-check]="currentStep > 1"></i>
                </div>
                <span class="step-label">Verify</span>
              </div>

              <!-- Step 2: Details -->
              <div class="step-item" [class.active]="currentStep === 2" [class.completed]="currentStep > 2">
                <div class="step-circle">
                  <i class="fas" [class.fa-user]="currentStep <= 2" [class.fa-check]="currentStep > 2"></i>
                </div>
                <span class="step-label">Details</span>
              </div>

              <!-- Step 3: Impact -->
              <div class="step-item" [class.active]="currentStep === 3" [class.completed]="currentStep > 3">
                <div class="step-circle">
                  <i class="fas" [class.fa-leaf]="currentStep <= 3" [class.fa-check]="currentStep > 3"></i>
                </div>
                <span class="step-label">Impact</span>
              </div>
            </div>

            <form #signupForm="ngForm" class="signup-form">
              
              <!-- STEP 1: VERIFICATION -->
              <div *ngIf="currentStep === 1" class="animate-slide-up">
                <div class="mb-4 input-group-custom">
                  <label for="signup-email" class="form-label">Email Address</label>
                  <div class="input-with-icon">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="signup-email" name="signup-email" class="form-control form-input"
                           placeholder="name@amazon.com" [(ngModel)]="_user.email" (input)="onEmailInput($event)" required
                           [disabled]="isEmailVerified">
                  </div>
                  <button type="button" class="btn btn-warning btn-sm mt-2 w-100" (click)="sendOtp()" *ngIf="!isEmailVerified"
                          [disabled]="!isEmailSent || isEmailVerified">
                    Verify Email
                  </button>
                  <span class="text-success d-block mt-2" *ngIf="isEmailVerified"><i class="fas fa-check-circle me-1"></i> Email Verified</span>
                </div>

                <div class="mb-4 input-group-custom">
                  <label for="signup-phone" class="form-label">Phone Number</label>
                  <div class="input-with-icon">
                    <i class="fas fa-phone input-icon"></i>
                    <input type="tel" id="signup-phone" name="signup-phone" class="form-control form-input"
                           placeholder="Enter your 10-digit phone number" [(ngModel)]="_user.mobile_No" (input)="onPhoneInput($event)" required
                           [disabled]="isPhoneVerified">
                  </div>
                  <div class="mt-2">
                    <button type="button" class="btn btn-warning btn-sm w-100" (click)="sendPhoneOtp()" *ngIf="!isPhoneVerified"
                            [disabled]="!_user.mobile_No || _user.mobile_No.length !== 10 || isPhoneVerified">
                      Verify Phone
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm w-100 mt-2" (click)="editPhone()" *ngIf="isPhoneVerified">
                      Edit Phone
                    </button>
                    <span class="text-success d-block mt-2" *ngIf="isPhoneVerified"><i class="fas fa-check-circle me-1"></i> Phone Verified</span>
                  </div>
                </div>

                <button type="button" class="btn btn-primary btn-lg w-100 shadow-sm" (click)="nextStep()"
                        [disabled]="!isEmailVerified || !isPhoneVerified">
                  Next: Enter Details <i class="fas fa-arrow-right ms-2"></i>
                </button>
              </div>

              <!-- STEP 2: DETAILS -->
              <div *ngIf="currentStep === 2" class="animate-slide-up">
                <div class="mb-4 input-group-custom">
                  <label for="signup-name" class="form-label">Full Name</label>
                  <div class="input-with-icon">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="signup-name" name="signup-name" class="form-control form-input" placeholder="Your full name"
                           [(ngModel)]="_user.name" required>
                  </div>
                </div>

                <div class="mb-4 input-group-custom">
                  <label for="signup-password" class="form-label">Password</label>
                  <div class="input-with-icon">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="signup-password" name="signup-password" class="form-control form-input"
                           placeholder="Create a password" [(ngModel)]="_user.Password" required> 
                  </div>
                </div>

                <div class="mb-4 input-group-custom">
                  <label for="signup-address" class="form-label">Home Location</label>
                  <div class="input-with-icon">
                    <i class="fas fa-map-marker-alt input-icon"></i>
                    <div class="flex-grow-1" style="margin-left: 2.8rem;">
                      <AutocompleteComponent (setAddress)="handleAddress($event)" [autocompleteInput]="_user.Address" [showIcon]="false"></AutocompleteComponent>
                    </div>
                  </div>
                </div>

                <div class="d-flex gap-2">
                  <button type="button" class="btn btn-outline-secondary btn-lg flex-grow-1" (click)="prevStep()">
                    Back
                  </button>
                  <button type="button" class="btn btn-primary btn-lg flex-grow-1" (click)="nextStep()"
                          [disabled]="!_user.name || !_user.Password || !_user.Address">
                    Next: Transport <i class="fas fa-arrow-right ms-2"></i>
                  </button>
                </div>
              </div>

              <!-- STEP 3: TRANSPORT IMPACT -->
              <div *ngIf="currentStep === 3" class="animate-slide-up">
                <div class="mb-3">
                    <label class="form-label fw-bold small text-muted text-uppercase">Current Commute Mode</label>
                    <div class="row g-2">
                      <div class="col-6">
                        <div class="selection-card p-2 text-center border rounded cursor-pointer" 
                             [class.bg-primary]="transportMode === 'Self'" 
                             [class.text-white]="transportMode === 'Self'"
                             (click)="selectTransport('Self')">
                          <i class="fas fa-car-side mb-1"></i>
                          <div class="small fw-bold">Self Driven</div>
                        </div>
                      </div>
                      <div class="col-6">
                        <div class="selection-card p-2 text-center border rounded cursor-pointer" 
                             [class.bg-primary]="transportMode === 'Cab'"
                             [class.text-white]="transportMode === 'Cab'"
                             (click)="selectTransport('Cab')">
                          <i class="fas fa-taxi mb-1"></i>
                          <div class="small fw-bold">Cab / Taxi</div>
                        </div>
                      </div>
                    </div>
                </div>

                <!-- Vehicle Type (If Self) -->
                <div class="mb-3 animate-slide-up" *ngIf="transportMode === 'Self'">
                    <label class="form-label fw-bold small text-muted text-uppercase">Vehicle Type</label>
                    <div class="row g-2">
                        <div class="col-6">
                        <div class="selection-card p-2 text-center border rounded cursor-pointer" 
                             [class.bg-primary]="vehicleType === 'Car'"
                             [class.text-white]="vehicleType === 'Car'"
                             (click)="selectVehicle('Car')">
                            <i class="fas fa-car mb-1"></i>
                            <div class="small fw-bold">Car</div>
                        </div>
                        </div>
                        <div class="col-6">
                        <div class="selection-card p-2 text-center border rounded cursor-pointer" 
                             [class.bg-primary]="vehicleType === 'Bike'"
                             [class.text-white]="vehicleType === 'Bike'"
                             (click)="selectVehicle('Bike')">
                            <i class="fas fa-motorcycle mb-1"></i>
                            <div class="small fw-bold">Bike</div>
                        </div>
                        </div>
                    </div>
                </div>

                <!-- Fuel Type -->
                <div class="mb-3 animate-slide-up" *ngIf="transportMode === 'Self' && vehicleType">
                    <label class="form-label fw-bold small text-muted text-uppercase">Fuel Type</label>
                    <div class="row g-2">
                        <ng-container *ngIf="vehicleType === 'Car'">
                            <div class="col-6" *ngFor="let fuel of ['Petrol', 'Diesel', 'CNG', 'Electric']">
                                <div class="selection-card p-2 text-center border rounded cursor-pointer"
                                     [class.bg-primary]="fuelType === fuel"
                                     [class.text-white]="fuelType === fuel"
                                     (click)="selectFuel(fuel)">
                                    <div class="small fw-bold">{{fuel}}</div>
                                </div>
                            </div>
                        </ng-container>
                        <ng-container *ngIf="vehicleType === 'Bike'">
                            <div class="col-6" *ngFor="let fuel of ['Petrol', 'Electric']">
                                <div class="selection-card p-2 text-center border rounded cursor-pointer"
                                     [class.bg-primary]="bikeFuelType === fuel"
                                     [class.text-white]="bikeFuelType === fuel"
                                     (click)="selectFuel(fuel)">
                                    <div class="small fw-bold">{{fuel}}</div>
                                </div>
                            </div>
                        </ng-container>
                    </div>
                </div>

                <!-- Impact Result Mini-Card -->
                <div class="impact-result-card p-3 bg-light rounded mb-4 border" *ngIf="impactCalculated">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <small class="text-muted d-block">Distance</small>
                            <span class="fw-bold">{{ distanceKm | number:'1.1-1' }} km</span>
                        </div>
                        <div class="text-end">
                            <small class="text-muted d-block">Potential Savings</small>
                            <span class="fw-bold text-success">{{ co2Saved | number:'1.2-2' }} kg CO2</span>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                  <button type="button" class="btn btn-outline-secondary btn-lg flex-grow-1" (click)="prevStep()">
                    Back
                  </button>
                  <button type="button" class="btn btn-success btn-lg flex-grow-1 shadow-sm" (click)="signup()"
                          [disabled]="!impactCalculated">
                    <i class="fas fa-check-circle me-2"></i> Create Account
                  </button>
                </div>
              </div>

              <div class="text-center mt-3">
                <button type="button" class="btn btn-link already-registered-btn" (click)="toggleForm(true)">
                  Already Registered? Login here
                </button>
              </div>
            </form>
          </div>
